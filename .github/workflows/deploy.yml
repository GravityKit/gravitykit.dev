name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Run weekly on Sundays at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:  # Allow manual trigger

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: npm ci

      - name: Clone GravityKit repositories
        run: npm run repos:clone
        env:
          # GH_TOKEN needs read access to GravityKit private repos
          GH_TOKEN: ${{ secrets.GK_REPOS_TOKEN }}

      - name: Generate hooks documentation
        run: npm run docs:generate

      # Kept as its own step rather than chained into docs:generate, so a fetch problem is
      # attributable and cannot take the rest of the site's build down with it by accident.
      # The script itself still fails hard on a bad fetch: an empty catalog would render as a
      # product with no merge tags, which reads as a fact rather than a broken build.
      - name: Fetch the merge-tag artifact
        env:
          MERGE_TAGS_TOKEN: ${{ secrets.MERGE_TAGS_TOKEN }}
        run: npm run merge-tags:generate

      - name: Generate relationship graphs for LLMs
        run: npm run relations:generate

      - name: Enhance documentation for LLMs
        run: npm run llm:enhance

      - name: Build site
        run: npm run build
        env:
          # Google Analytics (GA4)
          GOOGLE_GTAG_ID: ${{ vars.GOOGLE_GTAG_ID }}
          # Algolia DocSearch configuration (optional)
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}
          ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_INDEX_NAME }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Tell the docs MCP to re-embed the published corpus for semantic_search.
  # Inert until the MCP_REINDEX_PAT secret (a fine-grained PAT with actions:write
  # on GravityKit/Docs-MCP) is added; the step skips cleanly otherwise.
  reindex-mcp:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Trigger semantic reindex
        env:
          GH_TOKEN: ${{ secrets.MCP_REINDEX_PAT }}
        if: ${{ env.GH_TOKEN != '' }}
        run: gh workflow run reindex.yml -R GravityKit/Docs-MCP --ref main
